[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = "0.12.6"
axum-login = "0.18.0"
dotenvy = "0.15.7"
password-auth = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors"] }
tower-sessions = "0.14.0"

[dependencies.mongodb]
version = "3.8.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
